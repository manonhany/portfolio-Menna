<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>Menna Hany | Portfolio</title>
    <style>
        body {
            font-family: Tahoma;
            background: #fdf2f8;
            text-align: center;
            padding: 20px;
        }

        header {
            background: #5348ec;
            color: white;
            padding: 30px;
            border-radius: 20px;
        }

        table {
            width: 90%;
            margin: 20px auto;
            background: white;
            border-collapse: collapse;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        th {
            background: #5348ec;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        tr:last-child td {
            border-bottom: none;
        }
    </style>
</head>

<body>
    <header>
        <h1>Menna Hany Saad Eldeen Elsbaey</h1>
        <p>Front-End Developer</p>
    </header>
    <h2>مشروعي: نظام تقييم الطلاب</h2>

    <table>
        <thead>
            <tr>
                <th>الاسم</th>
                <th>المتوسط</th>
                <th>التقدير</th>
                <th>النتيجة</th>
            </tr>
        </thead>
        <tbody id="students"></tbody>
    </table>

    <script>
        class Student {
            constructor(id, name, grades, attendance) {
                this.id = id; this.name = name; this.grades = grades; this.attendance = attendance;
            }
            getAverage() {return this.grades.reduce((a, b) => a + b, 0) / this.grades.length;}
            getGrade() {
                let avg = this.getAverage();
                if (avg >= 90) return "A";
                if (avg >= 80) return "B";
                if (avg >= 70) return "C";
                if (avg >= 60) return "D";
                if (avg >= 50) return "E";
                return "F";
            }
            getResult() {if (this.getAverage() >= 50 && this.attendance >= 75) return "ناجح"; return "يحتاج مراجعة";}
        }
        const studentsList = [
            new Student(1, "عمر محمد", [85, 90, 78], 95),
            new Student(2, "منه هاني", [98, 96, 99], 100),
            new Student(3, "ميرنا خالد", [65, 70, 60], 70),
            new Student(4, "نور جميل", [40, 44, 46], 88),
        ];
        const container = document.getElementById("students");
        studentsList.forEach((s) => {
            container.innerHTML += `<tr><td>${s.name}</td><td>${s.getAverage().toFixed(2)}</td><td>${s.getGrade()}</td><td>${s.getResult()}</td></tr>`;
        });
    </script>
</body>

</html>
